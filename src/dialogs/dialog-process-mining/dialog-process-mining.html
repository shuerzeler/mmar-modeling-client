<mdc-dialog-title>
    Process Mining
</mdc-dialog-title>
<mdc-dialog-content>
    <!-- File Upload -->
    <h3>Upload Event Log</h3>
    <input type="file" accept=".csv,.xes" ref="fileInput" change.trigger="onFileChange($event)">
 
    <!-- Algorithm Selection -->
    <h3>Algorithm</h3>
    <mdc-select label="Select algorithm." value.bind="algorithmChoice" required style="display: flex;">
        <mdc-list style="width: 100%;">
            <mdc-list-item></mdc-list-item>
            <mdc-list-item value="alpha">Alpha Miner → Petri Net</mdc-list-item>
            <mdc-list-item value="inductive">Inductive Miner → Petri Net</mdc-list-item>
            <mdc-list-item value="heuristic">Heuristic Miner → Petri Net</mdc-list-item>
            <mdc-list-item value="bpmn_inductive">Inductive Miner → BPMN</mdc-list-item>
        </mdc-list>
    </mdc-select>
 
    <!-- CSV Column Mapping — only shown for CSV files -->
    <div if.bind="isCsv && csvColumns.length > 0">
        <hr style="border: 0.5px solid; color: #000000;">
        <h3>CSV Column Mapping</h3>
    
        <label style="font-size: 12px; color: #666;">Case ID column</label>
        <select value.bind="caseId" style="display: block; width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            <option value="">-- select --</option>
            <option repeat.for="col of csvColumns" value.bind="col">${col}</option>
        </select>

        <label style="font-size: 12px; color: #666;">Activity Name column</label>
        <select value.bind="activityName" style="display: block; width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            <option value="">-- select --</option>
            <option repeat.for="col of csvColumns" value.bind="col">${col}</option>
        </select>

        <label style="font-size: 12px; color: #666;">Timestamp column</label>
        <select value.bind="timestamp" style="display: block; width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            <option value="">-- select --</option>
            <option repeat.for="col of csvColumns" value.bind="col">${col}</option>
        </select>
        <!-- Line -->
        <hr style="border: 0.5px solid; color: #000000;">
    </div>
    

    <p if.bind="statusMessage" css="color: ${statusColor};">${statusMessage}</p>

</mdc-dialog-content>
<mdc-dialog-actions style="justify-content: space-between;">
    <button mdc-button data-mdc-dialog-action="cancel">Close</button>
    <mdc-button outlined click.trigger="runProcessMining()" disabled.bind="isRunning">
        <mdc-icon>account_tree</mdc-icon> Run
    </mdc-button>
</mdc-dialog-actions>
